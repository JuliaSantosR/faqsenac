services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: unifaq
      POSTGRES_PASSWORD: unifaq123
      POSTGRES_DB: unifaq
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unifaq -d unifaq"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://unifaq:unifaq123@db:5432/unifaq?schema=public"
      JWT_SECRET: "unifaq-jwt-secret-troque-em-producao"
      JWT_EXPIRES_IN: "8h"
      PORT: "3000"
      NODE_ENV: "production"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
